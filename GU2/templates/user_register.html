<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registerStyle.css') }}">
    <script>
        // Function to display the message in an alert and redirect to user_login
        function displayMessage() {
            var message = "{{ message }}";
            if (message && message !== "None") {
                if (message === 'Registration successful! You can now log in.') {
                    alert(message);
                    window.location.href = '{{ url_for('user_login') }}';
                } else {
                    alert(message);
                }
            }
        }

        // Function to validate password
        function validatePassword() {
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }
            displayMessage();
            return true;
        }
    </script>


</head>
<body>
<div class="container">
    <h2>Welcome to the BUAA Graduate Scholarship Application System</h2>
    <h3>User Registration</h3>

    <form method="post" action="{{ url_for('user_register') }}" onsubmit="return validatePassword()">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br>

        <label for="gender">Gender:</label>
        <input type="text" id="gender" name="gender" required><br>

        <label for="birth">Birth:</label>
        <input type="date" id="birth" name="birth" required><br>

        <label for="telephone">Telephone:</label>
        <input type="text" id="telephone" name="telephone" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="major">Major:</label>
        <select id="major" name="major" required>
            <option value="Software Development">Software Development</option>
            <option value="International Trade">International Trade</option>
            <option value="Computer Mathematics">Computer Mathematics</option>
        </select><br>


        <input type="submit" value="Register">
    </form>

    {% if message %}
        <script>
            displayMessage();
        </script>
    {% endif %}

    <div class="buttons">
        <button onclick="window.location.href='{{ url_for('user_login') }}'">Back to Login</button>
    </div>
</div>
</body>
</html>
